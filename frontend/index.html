<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clash of Clans — Clan Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">⚔</div>
        <div><div class="brand-name">CLAN HQ</div><div class="brand-sub">Clash Intelligence</div></div>
      </div>
      <nav>
        <button class="nav-item active" data-section="overview"><span>▦</span> Overview</button>
        <button class="nav-item" data-section="members"><span>♟</span> Members</button>
        <button class="nav-item" data-section="war"><span>⚔</span> Current War</button>
        <button class="nav-item" data-section="history"><span>◷</span> War History</button>
        <button class="nav-item" data-section="capital"><span>◈</span> Capital Raids</button>
      </nav>
      <div class="sidebar-footer">
        <div class="status-dot"></div><span id="connectionStatus">Demo data</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">CLAN OPERATIONS CENTER</div>
          <h1 id="pageTitle">Overview</h1>
        </div>
        <div class="topbar-actions">
          <span class="updated" id="updatedAt">—</span>
          <button class="refresh" id="refreshBtn">↻ Refresh</button>
        </div>
      </header>

      <div id="errorBanner" class="error-banner hidden"></div>
      <section id="overview" class="page-section active"></section>
      <section id="members" class="page-section"></section>
      <section id="war" class="page-section"></section>
      <section id="history" class="page-section"></section>
      <section id="capital" class="page-section"></section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
